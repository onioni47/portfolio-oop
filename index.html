
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
<header class="hero">
    <nav class="navbar">
        <span class="logo">PARK SE ON.</span>
        <span class="nav-label">MY PORTFOLIO · 2026</span>
    </nav>

    <div class="hero-content">
        <p class="eyebrow">WELCOME TO MY SPACE</p>
        <h1>Park Se On<span>.</span></h1>
        <p class="intro">
            Exploring ideas, building projects,<br>
            and growing through technology.
        </p>
        <a href="#projects" class="explore-btn">EXPLORE MY WORK ↘</a>
    </div>

    <div class="hero-bottom">
        <span>COMPUTER ENGINEERING STUDENT</span>
        <span>BASED IN SOUTH KOREA</span>
    </div>
</header>


    <main>
        <section>
            <h2>Projects</h2>
            <div id="project-list"></div>
        </section>

        <section>
            <h2>Add New Project</h2>
            <form id="project-form">
                <input type="text" id="title" placeholder="Project Title" required>
                <textarea id="description" placeholder="Project Description" required></textarea>
                <input type="text" id="skills" placeholder="Skills (HTML, CSS, JS)" required>
                <button type="submit">Add Project</button>
            </form>
        </section>
    </main>

    <script src="project.js"></script>
</body>
</html>
